<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        p#normal {
            font-family: arial,helvetica;
            font-size: 11px;
            font-weight: bold;
        }

        *#destacado {
            border-style: solid;
            border-color: blue;
            border-width: 2px;
        }
    
        #distinto {
            background-color: #9EC7EB;
            color: red;
        }

    </style>
    
    <p id="normal">Este es un párrafo con font arial o helvetica de tamaño 11 en bold.</p>

    <p id="destacado">Este es otro párrafo con un borde sólido, azul, de 2px de ancho.</p>
    <table id="destacado"><tr><td>Esta es una tabla con un borde sólido, azul, de 2px de ancho.</td></tr></table>

    <p id="distinto">Este es el último párrafo con un fondo celeste y texto en rojo.</p>
    
</body>
</html>
