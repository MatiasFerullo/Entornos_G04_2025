<html>
<head>
    <title>Ejemplo con frameset</title>
</head>

<frameset rows="20%,70%,10%" frameborder="0">

    <!-- HEADER -->
    <frameset cols="60%,40%">
        <frame src="encabezado.html" name="encabezado">
        <frame src="logo.html" name="logo">
    </frameset>

    <!-- BODY -->
    <frameset cols="30%,70%">
        <frame src="menu.html" name="menu">
        <frame src="principal.html" name="principal">
    </frameset>

    <!-- FOOTER -->
    <frame src="footer.html" name="footer">

</frameset>
</html>
